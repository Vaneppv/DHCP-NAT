services:
  dhcp_server:
    image: alpine:latest
    container_name: dhcp_server
    cap_add:
      - NET_ADMIN
    networks:
      red_oficina:
        ipv4_address: 192.168.10.2
    command: >
      sh -c "apk add --no-cache dnsmasq &&
      dnsmasq --no-daemon --interface=eth0
      --dhcp-range=192.168.10.50,192.168.10.80,255.255.255.0,12h
      --dhcp-option=option:router,192.168.10.254
      --dhcp-option=option:dns-server,8.8.8.8
      --dhcp-leasefile=/tmp/dnsmasq.leases
      --log-dhcp"

  router_nat:
    image: alpine:latest
    container_name: router_nat
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
    depends_on:
      - dhcp_server
    networks:
      red_oficina:
        ipv4_address: 192.168.10.254
      red_externa:
    command: >
      sh -c "apk add --no-cache iptables &&
      ip route replace default via 10.99.0.1 &&
      iptables -P FORWARD ACCEPT &&
      iptables -t nat -A POSTROUTING -s 192.168.10.0/24 -j MASQUERADE &&
      sleep infinity"

  pc_oficina:
    image: alpine:latest
    container_name: pc_oficina
    cap_add:
      - NET_ADMIN
    depends_on:
      - dhcp_server
      - router_nat
    networks:
      - red_oficina
    command: >
      sh -c "sleep 6 &&
      ip addr flush dev eth0 &&
      udhcpc -i eth0 -n -q ;
      ip route del default via 192.168.10.1 2>/dev/null || true ;
      ip route show default | grep -q . || ip route add default via 192.168.10.254 dev eth0 ;
      sleep infinity"

  nodo_red:
    image: alpine:latest
    container_name: nodo_red
    command: sleep infinity
    networks:
      red_oficina:
        ipv4_address: 192.168.10.3

networks:
  red_oficina:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.10.0/24
          ip_range: 192.168.10.96/27
  red_externa:
    driver: bridge
    ipam:
      config:
        - subnet: 10.99.0.0/24
